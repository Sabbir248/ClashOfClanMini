# ============================================
# Clash of Clans Mini - Server Configuration
# ============================================

# Spring Application
spring.application.name=clash-game-server

# ─── Database Configuration (MySQL) ──────────
spring.datasource.url=jdbc:mysql://localhost:3306/clash_game_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Alternative: PostgreSQL ──────────────────
# spring.datasource.url=jdbc:postgresql://localhost:5432/clash_game_db
# spring.datasource.username=postgres
# spring.datasource.password=your_password_here
# spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Let Hibernate auto-detect the dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Server Configuration ────────────────────
server.port=8080

# ─── Game Server Configuration ───────────────
game.server.port=9090
game.server.max-clients=100

# ─── Logging ─────────────────────────────────
logging.level.com.clashgame=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
